services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/portfolio.db
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
